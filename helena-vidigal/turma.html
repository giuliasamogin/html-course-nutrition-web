<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <title>Turma | Helena Vidigal, Nutrição Comportamental</title>
  <meta name="description" content="Turma de 8 pessoas por ciclo: o método Raio-X, Ajuste e Sustento in grupo.">
  
  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  
  <!-- Estilos -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/pages.css">
</head>

<body data-page="turma.html">

  <!-- Componentes de Topo -->
  <site-header></site-header>

  <!-- Conteúdo Principal -->
  <main>

    <!-- Cabeçalho da Página -->
    <section class="phead">
      <div class="wrap">
        <h1>Oito vagas por ciclo.</h1>
        <p>O mesmo método do programa, em grupo, com a troca de quem está no mesmo caminho.</p>
      </div>
    </section>

    <!-- Status de Vagas e Formulário de Espera -->
    <section>
      <div class="wrap split">
        <!-- Indicador de Vagas Ocupadas/Disponíveis -->
        <div>
          <h2>Restam <span data-restam>5</span> vagas neste mês</h2>
          <div id="dots" class="dots" aria-hidden="true"></div>
          
          <p>Círculos preenchidos são vagas já ocupadas. <strong>R$ 697</strong> no ciclo de 12 semanas.</p>
        </div>

        <!-- Formulário de Conversão -->
        <div class="reveal">
          <h2>Entre na lista de espera</h2>
          <form class="fld js-form">
            <label for="n">Nome</label>
            <input id="n" required minlength="3">
            
            <label for="t">WhatsApp</label>
            <input id="t" required inputmode="tel" placeholder="(11) 99999-9999">
            
            <label for="o">Atendimento</label>
            <select id="o">
              <option>Online</option>
              <option>Presencial em Osasco</option>
            </select>
            
            <button class="btn">Entrar na lista</button>
          </form>
        </div>
      </div>
    </section>

  </main>

  <!-- Componentes de Rodapé / Popups -->
  <site-footer></site-footer>
  <contact-popup></contact-popup>
  <cookie-bar></cookie-bar>

  <!-- Scripts -->
  <script src="js/components.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages.js"></script>

</body>
</html>
